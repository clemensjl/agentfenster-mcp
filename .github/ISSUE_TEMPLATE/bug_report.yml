name: Bug report
description: A tool of the agentfenster MCP server behaves wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This tracker covers the MCP server. For questions about the app itself, use Discord or hello@agentfenster.com. Do not paste secrets or personal data.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: call
    attributes:
      label: Tool call and output
      description: Tool name, arguments and the result the server returned
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agentfenster version
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Claude Code 2.x
  - type: input
    id: target
    attributes:
      label: Target application
      description: The program the tool was driving, if any
